<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Library — Decommissioned</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #faf7f0;
            color: #1e1e1e;
            font-family: 'Georgia', 'Times New Roman', Times, serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
        }

        .title {
            font-size: 3.5rem;
            font-weight: normal;
            letter-spacing: -0.5px;
            margin-bottom: 2rem;
            color: #1e1e1e;
        }

        .decommissioned {
            font-size: 1.5rem;
            color: #9b8e7a;
            font-style: italic;
            letter-spacing: 2px;
        }

        .sub {
            margin-top: 2rem;
            color: #b5a898;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 2.5rem;
            }
            .decommissioned {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Lost Library</h1>
        <div class="decommissioned">Decommissioned</div>
        <div class="sub">—</div>
    </div>
</body>
</html>
